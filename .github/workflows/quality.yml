name: Repository quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements_dev.txt
      - name: Run repository tests
        env:
          PYTHONUTF8: "1"
        run: python -m pytest
